<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce AI Agent</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" type="image/svg+xml">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js library for rendering the bar chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- html2pdf library for PDF download functionality -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Custom UI styling for layout, glassmorphism, and responsive elements -->
    <style>
        /* Force container to use maximum width for a premium dashboard look */
        .container, #reportContainer {
            max-width: 95% !important;
            width: 1200px;
            margin: 0 auto;
        }

        /* Upgrade the initial input controls area with a glassmorphism card design */
        .controls {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 25px;
            max-width: 600px;
            margin: 0 auto 30px auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Make input field blend with the new dark premium theme */
        .controls input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #00f2fe;
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 16px;
            outline: none;
            width: 120px;
            text-align: center;
        }

        /* Enhance the main generate button */
        .controls button {
            padding: 12px 25px;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #1a1a2e;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .controls button:hover {
            transform: scale(1.05);
        }

        /* Base glassmorphism style for statistics boxes */
        .stat-box {
            border-radius: 15px !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(10px) !important;
            transition: transform 0.3s ease !important;
            padding: 20px;
            text-align: center;
        }
        
        .stat-box:hover {
            transform: translateY(-5px) !important;
        }

        /* Colorful Gradient for the First Box (Days Analyzed) */
        .stat-box:nth-child(1) {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%) !important;
            border: none !important;
        }
        
        /* Colorful Gradient for the Second Box (Total Reviews) */
        .stat-box:nth-child(2) {
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%) !important;
            border: none !important;
        }
        
        /* Ensure text color is bright and readable inside colorful boxes */
        .stat-box h3, .stat-box p {
            color: white !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Optimize chart size for a cleaner look */
        .chart-container {
            max-width: 500px !important; 
            margin: 30px auto !important;
        }

        /* Style the AI report text to resemble a clean white document */
        .report-content {
            background: white !important;
            color: #333 !important;
            padding: 40px !important;
            border-radius: 12px !important;
            margin-top: 25px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
            font-size: 16px !important;
            line-height: 1.6 !important;
        }

        /* New layout: Stack bottom actions vertically (Column) */
        .bottom-actions {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
            align-items: center;
        }

        /* Restrict width to keep the layout neat and centered */
        .action-box {
            width: 100%;
            max-width: 800px;
        }

        /* Upgraded Download PDF Button with reduced height */
        #downloadBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%) !important;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 75, 43, 0.3);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #downloadBtn:hover {
            transform: translateY(-3px);
        }

        /* Upgraded Chat Section to match premium glassmorphism look */
        #chatSection {
            margin-top: 10px !important; 
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-radius: 12px !important;
            padding: 25px !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(10px) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dashboard Header -->
        <header>
            <h1><i class="fas fa-robot"></i> AI Business Analyst</h1>
            <p>Generate deep insights, charts, and chat with your MySQL Database</p>
        </header>

        <!-- Input Controls Area -->
        <div class="controls">
            <label for="days">Analyze data for last: </label>
           <input type="number" id="days" placeholder="Days" min="1" value="30">
            
            <button id="generateBtn" onclick="generateReport()">
                <i class="fas fa-bolt"></i> Generate Report
            </button>
        </div>

        <!-- Loading State Indicator -->
        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>AI Agents are analyzing your database... Please wait.</p>
        </div>

        <!-- Main Report Container (Target for PDF Export) -->
        <div id="reportContainer" class="hidden">
            
            <!-- Statistics Row -->
            <div id="statsBoxes" class="stats-row">
                <div class="stat-box">
                    <h3>Days Analyzed</h3>
                    <p id="statDays">0</p>
                </div>
                <div class="stat-box">
                    <h3>Total Reviews</h3>
                    <p id="statReviews">0</p>
                </div>
            </div>
            
            <!-- Bar Chart Canvas -->
            <div class="chart-container">
                <canvas id="sentimentChart"></canvas>
            </div>

            <!-- AI Detailed HTML Report Injection Point -->
            <div id="aiOutput" class="report-content">
                <!-- Data fetched from backend will be injected here -->
            </div>
            
            <!-- Bottom Action Area: Stacked Vertically -->
            <div class="bottom-actions" id="actionArea">
                
                <!-- Top Action: PDF Download Button -->
                <div class="action-box">
                    <button id="downloadBtn" onclick="downloadPDF()">
                        <i class="fas fa-file-pdf"></i> Download Full Report
                    </button>
                </div>

                <!-- Bottom Action: Interactive AI Chat Interface -->
                <div id="chatSection" class="action-box">
                    <h3 style="margin-bottom: 15px;"><i class="fas fa-comments"></i> Ask AI About This Data</h3>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="chatInput" placeholder="E.g., What is the main battery issue?" style="flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #4facfe; background: rgba(0,0,0,0.3); color: white; outline: none;">
                        <button onclick="askChat()" style="width: auto; padding: 12px 25px; background: #00f2fe; color: #1a1a2e; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;"><i class="fas fa-paper-plane"></i> Ask</button>
                    </div>
                   <!-- Chat AI Reply Output Area -->
                   <div id="chatReply" style="margin-top: 15px; color: #e2e8f0; font-style: normal; line-height: 1.6; font-size: 15px; background: rgba(0,0,0,0.25); padding: 15px; border-radius: 8px; border-left: 4px solid #00f2fe; white-space: pre-wrap;"></div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Connect the external JavaScript file to enable logic -->
    <script src="script.js"></script>
</body>
</html>
